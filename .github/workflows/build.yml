name: Build iOS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project SuperAtlantico.xcodeproj -scheme SuperAtlantico \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SuperAtlantico.app Payload/
          zip -qr SuperAtlantico.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAtlantico-ipa
          path: SuperAtlantico.ipa
